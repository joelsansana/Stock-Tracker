[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-stocks"
version = "1.1.0"
description = "Stock market analysis, technical indicators, ARK ETF holdings, and sentiment analysis."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Joel Sansana" },
]
keywords = ["stocks", "finance", "technical-analysis", "sentiment-analysis", "ark-etf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "requests>=2.25.0",
    "yfinance>=0.1.70",
    "textblob>=0.15.3",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.4.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
transformers = [
    "transformers>=4.20.0",
    "torch>=1.9.0",
]
twitter = [
    "tweepy>=4.14.0",
]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "streamlit-aggrid>=0.3.4",
]
streamlit = [
    "python-stocks[ui,transformers,twitter]",
]

[project.urls]
"Homepage" = "https://github.com/joelsansana/python_stocks"
"Bug Tracker" = "https://github.com/joelsansana/python_stocks/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["python_stocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# UP006 (Dict -> dict) and UP045 (Optional[X] -> X | None) target Python 3.9+.
# We require 3.8, so the older typing.* names are intentional.
ignore = ["UP006", "UP045", "PYI034"]

[tool.ruff.lint.per-file-ignores]
# BLE001 (bare except Exception) is acceptable in glue code around third-party
# libraries (yfinance, textblob, tweepy, transformers) that raise varied
# exception hierarchies; catching broadly and logging is the right call.
"src/python_stocks/*.py" = ["BLE001"]
"app/pages/*.py" = ["BLE001"]